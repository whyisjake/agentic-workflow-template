# Flags issues that have the shape of an agent-ready issue, by applying
# 'agent-candidate'. It NEVER applies 'agent-ready' — that decision belongs to a
# human, and it is the label that starts a paid agent run.
#
# This matches what issue-screener.yml already says in its own header. The two
# workflows disagreed until 21 August, when this one applied 'agent-ready' to a
# freshly-opened issue that had no complexity label yet, a run started, and the
# agent took the direct path on work that was meant to be planned first. It
# spent 14 turns and produced nothing.
#
# The check itself lives in .github/actions/screen-issue, because the trigger
# uses the same one to refuse a malformed issue. One definition, two callers.
#
# It is structural: an issue with every heading and nothing written under them
# passes. That is why the label it applies is a hint, not a trigger.

name: Auto-Label Agent-Ready Issues

on:
  issues:
    types: [opened, edited]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-and-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Screen the issue
        id: screen
        uses: ./.github/actions/screen-issue
        with:
          issue_body: ${{ github.event.issue.body }}

      - name: Apply agent-candidate
        if: steps.screen.outputs.ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            if (labels.includes('agent-candidate') || labels.includes('agent-ready')) {
              console.log('Already flagged or already approved — nothing to do.');
              return;
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ['agent-candidate'],
              });
              console.log('Applied agent-candidate. A human applies agent-ready to start a run.');
            } catch (err) {
              // Most likely cause: the label does not exist in this repo yet.
              core.setFailed(
                `Failed to add agent-candidate: ${err.message}. ` +
                'Run the Setup Labels workflow (Actions → Setup Labels → Run workflow).');
            }
