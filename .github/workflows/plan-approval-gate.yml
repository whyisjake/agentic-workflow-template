# Listens for '/approve-plan' comments on issues and resumes ce-work execution.
#
# This workflow is part of the complexity:high flow:
#   1. agent-ready-trigger.yml fires, Claude runs /ce-plan, commits plan to docs/plans/
#   2. Claude posts a comment asking for /approve-plan
#   3. This workflow fires on that comment, verifies the commenter, then runs /ce-work
#
# Only collaborators with write or admin permission can approve plans.
# Non-collaborators receive a reply comment but no agent run is started.

name: Plan Approval Gate

on:
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  handle-approve-plan:
    # Only fire on /approve-plan comments (not PR comments, not other content)
    if: |
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/approve-plan')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plan is committed to plan/issue-<N> and never merged, so a default
          # checkout of the base branch has no docs/plans/ at all. Fetch everything
          # so the plan branch is present locally.
          fetch-depth: 0

      - name: Check commenter permissions
        id: permission-check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const issueNumber = context.payload.issue.number;

            let permLevel;
            try {
              const result = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: commenter
              });
              permLevel = result.data.permission;
            } catch (err) {
              // User is not a collaborator at all
              permLevel = 'none';
            }

            const allowed = ['write', 'admin'].includes(permLevel);
            console.log(`Commenter ${commenter} has permission: ${permLevel} — allowed: ${allowed}`);

            if (!allowed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `@${commenter} Only collaborators with write access can approve plans. Your approval was not processed.`
              });
            }

            core.setOutput('allowed', allowed ? 'true' : 'false');

      - name: Check for existing PR (idempotency)
        id: pr-check
        if: steps.permission-check.outputs.allowed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            // Check if any open PR references this issue
            const existing = prs.find(pr =>
              pr.body && (
                pr.body.includes(`Closes #${issueNumber}`) ||
                pr.body.includes(`closes #${issueNumber}`) ||
                pr.body.includes(`Fixes #${issueNumber}`) ||
                pr.body.includes(`fixes #${issueNumber}`)
              )
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `Implementation is already in progress: ${existing.html_url}`
              });
              core.setOutput('already_running', 'true');
            } else {
              core.setOutput('already_running', 'false');
            }

      - name: Run Claude Code with /ce-work
        if: |
          steps.permission-check.outputs.allowed == 'true' &&
          steps.pr-check.outputs.already_running == 'false'
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1.0.191
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The permission mode has to be passed here. Setting
          # permissions.defaultMode in `settings` below does NOT reach the SDK: a run
          # so configured reports "permissionMode": "default", and in CI every Write
          # blocks on an approval nobody can give. See the PR for the transcripts.
          claude_args: --permission-mode acceptEdits
          # Add your project's own test and lint commands to `allow` below —
          # e.g. "Bash(npm test)", "Bash(vendor/bin/phpunit)", "Bash(pytest)".
          # Prefer the narrowest pattern that works: a wildcard is a subcommand you
          # have not thought about yet, and "Bash(php *)" is "php -r '<any code>'".
          # Without them the
          # agent cannot verify its own work: it spends turns on commands that are
          # refused, and a refusal reads to it like a broken environment rather than
          # a policy decision.
          #
          # What this list is, and what it is not.
          #
          # The issue body is untrusted input that reaches the model as
          # instructions, and the run holds a write-scoped token with edits
          # pre-approved. So every entry here is reachable by whoever can get an
          # issue labelled.
          #
          # This list is NOT a sandbox, and you should not treat it as one.
          # "Bash(git *)" and "Bash(gh *)" are deliberate exceptions — the run
          # cannot commit or open a pull request without them — and both permit
          # far more than that: `git -c core.pager=...` and `git -c alias.x='!...'`
          # run arbitrary programs, and `git push <url>` and `gh gist create` send
          # data off the runner. The `deny` list below closes the escapes we know
          # about; it does not make the allow list airtight.
          #
          # The real boundary is upstream: who can cause a run to start. Keep the
          # trigger gated on a labelling actor with write access, and treat any
          # agent run as capable of whatever the workflow token can do.
          #
          # When you widen this list, narrow patterns are still worth preferring:
          # "Bash(npm test)" beats "Bash(npm *)".
          settings: |
            {
              "permissions": {
                "defaultMode": "acceptEdits",
                "allow": [
                  "Bash(git *)",
                  "Bash(gh *)",
                  "Bash(ls *)",
                  "Bash(cat *)",
                  "Bash(mkdir *)",
                  "Bash(rm *)",
                  "Bash(mv *)",
                  "Bash(cp *)",
                  "Bash(which *)"
                ],
                "deny": [
                  "Bash(git -c *)",
                  "Bash(git config *)",
                  "Bash(git remote *)",
                  "Bash(gh api *)",
                  "Bash(gh gist *)",
                  "Bash(gh alias *)",
                  "Bash(gh extension *)"
                ]
              }
            }
          # Uncomment to stream the full SDK output into the job log for debugging:
          # show_full_output: true
          prompt: |
            You are implementing issue #${{ github.event.issue.number }}.

            Issue title: ${{ github.event.issue.title }}

            A human has approved the plan for this issue. Your job is to implement it.

            Instructions:
            1. The approved plan is on the branch plan/issue-${{ github.event.issue.number }},
               which is NOT merged into this branch. Read it from there:
                 git show origin/plan/issue-${{ github.event.issue.number }} --stat
                 git checkout origin/plan/issue-${{ github.event.issue.number }} -- docs/plans/
               If that branch does not exist, look for a recent file in docs/plans/ instead.
            2. If a plan file exists, invoke /ce-work with the plan file path as input,
               and carry the plan file itself into your branch so the reasoning ships
               alongside the code
            3. If no plan file exists, say so in a comment on the issue before you
               implement anything — an approved plan that cannot be found is worth
               reporting, not working around silently
            4. Implement the feature per the plan or issue
            5. Open a PR using the agent-generated PR template
            6. Add the 'agent-generated' label to the PR

            Important:
            - Stay within the issue's defined scope ("Out of scope" is a hard boundary)
            - Reference the issue number in the PR: "Closes #${{ github.event.issue.number }}"
            - If blocked or uncertain, comment on the issue asking for clarification

            If this repository depends on code you cannot read from here — a private
            dependency, an API you cannot reach — do NOT guess its contract. Implement
            what you can, and state the unverified assumption plainly in the PR body (or
            in the plan) so a reviewer can check it. A confident PR built on a guessed
            interface passes review and fails in production.

          additional_permissions: |
            actions: read
