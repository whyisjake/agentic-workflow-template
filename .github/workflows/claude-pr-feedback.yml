# Lets a human revise an OPEN pull request by mentioning the agent in a comment.
#
# The rest of the template is one-shot per issue (the human reviews the PR and either
# approves/merges or refines the issue and re-runs). This workflow closes the in-PR
# feedback loop: when a reviewer comments "@claude <instruction>" on a PR — or leaves
# it in a PR review — Claude Code runs in interactive "tag mode", checks out the PR's
# head branch, makes the requested change, and pushes back to the same branch, which
# re-runs your CI on the PR.
#
# Provider note: this is specific to the `claude` provider (it uses
# anthropics/claude-code-action). The job no-ops unless AGENT_PROVIDER is `claude`
# (or unset, which defaults to claude elsewhere in the template). If you use another
# provider, add an equivalent feedback workflow for that tool.
#
# Authorization: it fires only on "@claude" comments from a collaborator with write/admin
# access (a permission gate runs before checkout — see the step below). Without it, on a
# public repo any user could drive the agent.
#
# Loop safety: it fires only on comments that literally contain "@claude". The agent's
# own progress/summary comments don't, so they create a run that immediately skips —
# no self-triggering loop.

name: Claude PR Feedback

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  claude-pr-feedback:
    # Only for the claude provider, only on PR comments/reviews that mention @claude.
    if: |
      (vars.AGENT_PROVIDER == 'claude' || vars.AGENT_PROVIDER == '') &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && github.event.review.body != null && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      # Authorization gate: only repo collaborators with write/admin may drive the
      # agent. Without this, on a public repo ANY user could comment "@claude …" and run
      # an agent with write access that checks out the PR head (attacker-controllable on
      # fork PRs) with the token in scope. Runs BEFORE checkout. Mirrors plan-approval-gate.yml.
      - name: Check commenter permissions
        id: permission-check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const p = context.payload;
            const commenter = (p.comment && p.comment.user.login) || (p.review && p.review.user.login);
            const prNumber = (p.issue && p.issue.number) || (p.pull_request && p.pull_request.number);
            let permLevel = 'none';
            try {
              const r = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo, username: commenter,
              });
              permLevel = r.data.permission;
            } catch (err) {
              permLevel = 'none';
            }
            const allowed = ['write', 'admin'].includes(permLevel);
            console.log(`Commenter ${commenter} has permission: ${permLevel} — allowed: ${allowed}`);
            if (!allowed && prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
                body: `@${commenter} Only collaborators with write access can drive \`@claude\` here — request ignored.`,
              });
            }
            core.setOutput('allowed', allowed ? 'true' : 'false');

      - name: Checkout
        if: steps.permission-check.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Claude Code (tag mode)
        if: steps.permission-check.outputs.allowed == 'true'
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1.0.191
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The permission mode has to be passed here. Setting
          # permissions.defaultMode in `settings` below does NOT reach the SDK: a run
          # so configured reports "permissionMode": "default", and in CI every Write
          # blocks on an approval nobody can give. See the PR for the transcripts.
          claude_args: --permission-mode acceptEdits
          trigger_phrase: "@claude"
          # claude-code-action runs in interactive permission mode by default, so in CI
          # every Write/Bash call blocks on an approval that never comes and the run hangs
          # until timeout. Grant a headless, non-interactive permission set so the agent
          # can actually edit files and use git/gh to push its fix.
          # Add your project's own test and lint commands to `allow` below —
          # e.g. "Bash(npm test)", "Bash(vendor/bin/phpunit)", "Bash(pytest)".
          # Prefer the narrowest pattern that works: a wildcard is a subcommand you
          # have not thought about yet, and "Bash(php *)" is "php -r '<any code>'".
          # Without them the
          # agent cannot verify its own work: it spends turns on commands that are
          # refused, and a refusal reads to it like a broken environment rather than
          # a policy decision.
          #
          # What this list is, and what it is not.
          #
          # This workflow is gated to write-access collaborators (see the header),
          # but it checks out the PR head branch, which is attacker-controlled on
          # fork pull requests — so the comment text and that branch's contents are
          # untrusted input reaching the model as instructions, even though a
          # trusted collaborator typed the trigger phrase.
          #
          # This list is NOT a sandbox. "Bash(git *)" and "Bash(gh *)" are
          # deliberate exceptions — the run cannot push a fix or comment without
          # them — and both permit arbitrary execution (`git -c alias.x='!...'`)
          # and egress (`git push <url>`, `gh gist create`). The `deny` list below
          # closes the escapes we know about; it does not make this airtight.
          #
          # When you widen this list, narrow patterns are still worth preferring:
          # "Bash(npm test)" beats "Bash(npm *)".
          settings: |
            {
              "permissions": {
                "defaultMode": "acceptEdits",
                "allow": [
                  "Bash(git *)",
                  "Bash(gh *)",
                  "Bash(ls *)",
                  "Bash(cat *)",
                  "Bash(mkdir *)",
                  "Bash(rm *)",
                  "Bash(mv *)",
                  "Bash(cp *)",
                  "Bash(which *)"
                ],
                "deny": [
                  "Bash(git -c *)",
                  "Bash(git config *)",
                  "Bash(git remote *)",
                  "Bash(gh api *)",
                  "Bash(gh gist *)",
                  "Bash(gh alias *)",
                  "Bash(gh extension *)"
                ]
              }
            }
          # Uncomment to stream the full SDK output into the job log for debugging:
          # show_full_output: true
          additional_permissions: |
            actions: read
